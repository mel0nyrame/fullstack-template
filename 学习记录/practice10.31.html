<body>
<h1>各级标题大小不一样最大就是h1</h1>
<h2>h2</h2>
<h3>h3</h3>
<p>段落标签 用于书写正文部分
一下展示一些md常用的格式标签
<b>加粗</b>
<i>斜体</i>
<u>下划线</u>
<s>删除线</s>
以上标签都可以嵌套使用
接着是无序列表和有序列表表现形式上的差异 比如无序顾名思义就只有原点ul是无序列表的起手式ol则是有序列表起手式 二者都含有里列表
<ul>
    <li>无序列表1</li>
    <li>无序列表2</li>
    <li>无序列表3</li>
</ul>
<ol>
    <li>有序列表1</li>
    <li>有序列表2</li>
    <li>有序列表3</li>
</ol>
接下来就是表格标签（既有行又有列）
<table border="3">
<tr>
<th>列标题</th>
<th>列标题</th>
<th>列标题</th>
</tr>
 <tr>
    <td>1</td>
    <td>2</td>
    <td>3</td>
 </tr> 
  <tr>

 </tr>

 </tr>
