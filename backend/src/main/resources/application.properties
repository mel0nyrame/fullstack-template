spring.application.name=campus-erp

# 数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/campus_erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# 表结构由 sql/schema.sql 维护，不让 JPA 自动改
spring.jpa.hibernate.ddl-auto=none

# 把执行的 SQL 打印出来，方便学习
spring.jpa.show-sql=true